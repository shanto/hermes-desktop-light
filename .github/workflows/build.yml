# Hermes Desktop Light - part one of two.
#
# This repository tracks only the newest plain (non-prerelease) release of
# NousResearch/hermes-agent, builds the upstream-native remote-only "light" Windows
# payload from that exact commit, verifies it, and publishes it as a release here.
# No upstream Desktop channel or feed is consulted: upstream's release *claim* is
# used purely because upstream's own preparation demands it.
#
# Part two is the Scoop bucket, which lives in another repository. The `publish` job
# commits the manifest for every new build into that bucket (`SCOOP_REPO`, default
# `shanto/Scoop`) through the `SCOOP_TOKEN` secret, which must be able to write there.
# `latest.json` stays in this repository's `main` because the manifest's `checkver` and
# `autoupdate` poll it.
name: Hermes Desktop Light build

on:
  schedule:
    # Every six hours at :52 -- 00:52/06:52/12:52/18:52 UTC. Actions cron is always
    # UTC; the resolver exits in seconds when nothing is new, so extra fires are cheap.
    - cron: '52 */6 * * *'
  workflow_dispatch:
    inputs:
      revision:
        description: 'Build revision for the same upstream release (1 = first build, 2+ = rebuild)'
        required: true
        default: '1'
        type: string
      force:
        description: 'Build even though this version is already published here'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# Concurrency is deliberately per job, not per workflow: the upstream commit is only
# known after `resolve` runs, so a workflow-level group cannot be keyed on it.
# `checks` and `resolve` are cheap and stay unconstrained; the expensive work is bound
# to the upstream commit and the publish step to the release tag.

jobs:
  checks:
    name: Unit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Version ordering against Scoop's own comparator
        shell: pwsh
        run: ./tests/version-order.ps1
      - name: Resolution, guard and published-shape checks
        run: python3 -m unittest discover -s tests -v

  resolve:
    name: Resolve upstream release
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.resolve.outputs.build }}
      skip_reason: ${{ steps.resolve.outputs.skip_reason }}
      version: ${{ steps.resolve.outputs.version }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      upstream_repo: ${{ steps.resolve.outputs.upstream_repo }}
      upstream_tag: ${{ steps.resolve.outputs.upstream_tag }}
      upstream_commit: ${{ steps.resolve.outputs.upstream_commit }}
      upstream_url: ${{ steps.resolve.outputs.upstream_url }}
      upstream_published_at: ${{ steps.resolve.outputs.upstream_published_at }}
      claim_tag: ${{ steps.resolve.outputs.claim_tag }}
      claim_object: ${{ steps.resolve.outputs.claim_object }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVISION: ${{ inputs.revision || '1' }}
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail
          args=(--repository "${{ github.repository }}" --revision "$REVISION" --output "$GITHUB_OUTPUT")
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          python3 scripts/resolve_release.py "${args[@]}"
      - name: Summarise
        run: |
          {
            echo "### Hermes Desktop Light"
            echo ""
            echo "- upstream release: ${{ steps.resolve.outputs.upstream_tag }}"
            echo "- upstream commit: ${{ steps.resolve.outputs.upstream_commit }}"
            echo "- release claim: ${{ steps.resolve.outputs.claim_tag }}"
            echo "- build version: ${{ steps.resolve.outputs.version }}"
            echo "- build this run: ${{ steps.resolve.outputs.build }}"
            echo "- skipped because: ${{ steps.resolve.outputs.skip_reason }}"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build and verify
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: windows-2025
    timeout-minutes: 180
    concurrency:
      # One build per upstream commit, and never cancel a build that is already
      # running: cancelling would throw away up to two hours of work and start it
      # over. A duplicate run for the same commit instead queues behind it and then
      # short-circuits in the check below, because by then the release exists.
      group: build-${{ needs.resolve.outputs.upstream_commit }}
      cancel-in-progress: false
    steps:
      - name: Check out this builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: builder
      - name: Is this version already published?
        id: published
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ needs.resolve.outputs.release_tag }}'
          gh api "/repos/${{ github.repository }}/releases/tags/$tag" *> $null
          if ($LASTEXITCODE -eq 0) {
            'published=true' >> $env:GITHUB_OUTPUT
            Write-Host "release $tag already exists: skipping this build"
          }
          else {
            'published=false' >> $env:GITHUB_OUTPUT
          }
          # Actions appends `exit $LASTEXITCODE` to every pwsh step, so the 404 that
          # means "not published yet" would fail the step while still writing
          # published=false. The guard's verdict is the output, not gh's exit code.
          exit 0
      - name: Check out the admitted upstream commit
        if: steps.published.outputs.published == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.resolve.outputs.upstream_repo }}
          ref: ${{ needs.resolve.outputs.upstream_commit }}
          fetch-depth: 0
          path: upstream
      - if: steps.published.outputs.published == 'false'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Build, verify and package
        if: steps.published.outputs.published == 'false'
        shell: pwsh
        env:
          UPSTREAM_PUBLISHED_AT: ${{ needs.resolve.outputs.upstream_published_at }}
          UPSTREAM_URL: ${{ needs.resolve.outputs.upstream_url }}
        run: |
          $arguments = @(
            'builder/scripts/build_light.py'
            '--source', 'upstream'
            '--tag', '${{ needs.resolve.outputs.upstream_tag }}'
            '--expected-commit', '${{ needs.resolve.outputs.upstream_commit }}'
            '--claim-tag', '${{ needs.resolve.outputs.claim_tag }}'
            '--claim-object', '${{ needs.resolve.outputs.claim_object }}'
            '--version', '${{ needs.resolve.outputs.version }}'
            '--release-tag', '${{ needs.resolve.outputs.release_tag }}'
            '--asset-name', 'hermes-desktop-light-${{ needs.resolve.outputs.version }}-windows-x64.zip'
            '--out', 'output'
          )
          python @arguments
      - name: Upload the verified package
        if: steps.published.outputs.published == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hermes-desktop-light
          path: output/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: [resolve, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      # Never cancelled, only serialized per release tag: a duplicate run then stops at
      # "release already exists" rather than racing another publish. A published
      # release is never overwritten.
      group: publish-${{ needs.resolve.outputs.release_tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Is this version already published?
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "/repos/${{ github.repository }}/releases/tags/${{ needs.resolve.outputs.release_tag }}" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "release ${{ needs.resolve.outputs.release_tag }} already exists: nothing to publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.published.outputs.published == 'false'
        with:
          name: hermes-desktop-light
          path: output
      - name: Publish the release and refresh the pointer
        if: steps.published.outputs.published == 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/publish_release.py \
            --asset "output/hermes-desktop-light-${{ needs.resolve.outputs.version }}-windows-x64.zip" \
            --provenance output/provenance.json \
            --out-dir output \
            --update-main
      - name: Check out the Scoop bucket
        if: steps.published.outputs.published == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # github.token is scoped to this repository and cannot write there; the token
          # input also keeps the credential out of the remote URL. The bucket's own
          # default branch is used, so nothing here names it.
          repository: ${{ github.repository_owner }}/Scoop
          token: ${{ secrets.SCOOP_TOKEN }}
          path: scoop
      - name: Update the Scoop manifest
        if: steps.published.outputs.published == 'false'
        run: |
          set -euo pipefail
          manifest="output/hermes-desktop-light.json"
          if [ ! -f "${manifest}" ]; then
            echo "::error::${manifest} was not produced by the publish step"
            exit 1
          fi
          cp "${manifest}" scoop/bucket/hermes-desktop-light.json
      - name: Commit and push to the bucket
        id: bucket
        if: steps.published.outputs.published == 'false'
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5.2.0
        with:
          repository: scoop
          file_pattern: bucket/hermes-desktop-light.json
          commit_message: 'hermes-desktop-light: Update to version ${{ needs.resolve.outputs.version }}'
      - name: Verify the bucket carries the manifest
        if: steps.published.outputs.published == 'false'
        run: |
          set -euo pipefail
          branch="$(git -C scoop rev-parse --abbrev-ref HEAD)"
          git -C scoop fetch --quiet --depth 1 origin "${branch}"
          git -C scoop show "FETCH_HEAD:bucket/hermes-desktop-light.json" > "${RUNNER_TEMP}/bucket.json"
          diff -u output/hermes-desktop-light.json "${RUNNER_TEMP}/bucket.json"
          echo "verified ${branch} at $(git -C scoop rev-parse HEAD) carries the manifest"
      - name: Summarise
        run: |
          {
            echo "### ${{ needs.resolve.outputs.release_tag }}"
            echo ""
            echo "- already published before this run: ${{ steps.published.outputs.published }}"
            echo "- asset: hermes-desktop-light-${{ needs.resolve.outputs.version }}-windows-x64.zip"
            echo "- pointer: latest.json on main"
            echo "- bucket manifest: ${{ github.repository_owner }}/Scoop bucket/hermes-desktop-light.json (changed: ${{ steps.bucket.outputs.changes_detected || 'skipped' }})"
          } >> "$GITHUB_STEP_SUMMARY"
